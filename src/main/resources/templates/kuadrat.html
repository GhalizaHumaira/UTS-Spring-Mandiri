<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Soal 3 - Persamaan Kuadrat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 8px; width: 420px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Persamaan Kuadrat (ax² + bx + c = 0)</h2>
    <form action="/kuadrat" method="post">
        <div class="form-group">
            <label>Nilai a:</label>
            <input type="number" step="any" name="a" required />
        </div>
        <div class="form-group">
            <label>Nilai b:</label>
            <input type="number" step="any" name="b" required />
        </div>
        <div class="form-group">
            <label>Nilai c:</label>
            <input type="number" step="any" name="c" required />
        </div>
        <button type="submit">Hitung Akar-Akar</button>
    </form>

    <div th:if="${hasil != null}" class="result-box">
        <h3>Hasil Perhitungan:</h3>
        <p>Diskriminan (D): <b th:text="${hasil.diskriminan}"></b></p>
        <p>Tipe Akar: <b th:text="${hasil.tipe}"></b></p>
        <p>Akar X1: <b th:text="${hasil.x1}"></b></p>
        <p>Akar X2: <b th:text="${hasil.x2}"></b></p>
    </div>
</div>
</body>
</html>
