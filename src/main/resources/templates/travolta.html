<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Soal 2 - John Travolta</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 8px; width: 420px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Kalkulator Finansial John Travolta</h2>
    <form action="/travolta" method="post">
        <div class="form-group">
            <label>Jumlah Jam Kerja Seminggu:</label>
            <input type="number" step="0.5" name="jamKerja" required placeholder="Contoh: 50" />
        </div>
        <div class="form-group">
            <label>Pengeluaran Seminggu (Rp):</label>
            <input type="number" name="pengeluaran" th:value="${defaultPengeluaran}" required />
        </div>
        <button type="submit">Hitung Gaji & Tabungan</button>
    </form>

    <div th:if="${hasil != null}" class="result-box">
        <h3>Hasil Analisis:</h3>
        <p>Jam Kerja Normal: <b th:text="${hasil.jamNormal}"></b> jam</p>
        <p>Jam Lembur: <b th:text="${hasil.jamLembur}"></b> jam</p>
        <p>Gaji Normal: Rp <b th:text="${hasil.gajiNormal}"></b></p>
        <p>Gaji Lembur: Rp <b th:text="${hasil.gajiLembur}"></b></p>
        <p>Total Pemasukan: <b>Rp <span th:text="${hasil.totalPemasukan}"></span></b></p>
        <hr/>
        <p>Status: <b style="color: blue; text-transform: uppercase;" th:text="${hasil.statusFinansial}"></b></p>
        <p th:if="${hasil.sisaTabungan > 0}">Sisa Tabungan: <b>Rp <span th:text="${hasil.sisaTabungan}"></span></b></p>
    </div>
</div>
</body>
</html>
